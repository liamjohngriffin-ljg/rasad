services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rasad
      POSTGRES_PASSWORD: ${RASAD_DB_PASSWORD:?set RASAD_DB_PASSWORD in .env}
      POSTGRES_DB: rasad
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rasad"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    environment: &api_env
      RASAD_DATABASE_URL: postgresql+psycopg://rasad:${RASAD_DB_PASSWORD}@db:5432/rasad
      RASAD_MODEL_PROVIDER: ${RASAD_MODEL_PROVIDER:-rules}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RASAD_LOCAL_MODEL_BASE_URL: ${RASAD_LOCAL_MODEL_BASE_URL:-}
      RASAD_LOCAL_MODEL_NAME: ${RASAD_LOCAL_MODEL_NAME:-jais-2-70b-chat}
      RASAD_ADMIN_USERNAME: ${RASAD_ADMIN_USERNAME:-admin}
      RASAD_ADMIN_PASSWORD: ${RASAD_ADMIN_PASSWORD:-}
      RASAD_SECRET: ${RASAD_SECRET:-}
      RASAD_PUBLIC_RECORD: ${RASAD_PUBLIC_RECORD:-false}
      RASAD_CORS_ORIGINS: ""
      RASAD_DATA_DIR: /data
      RASAD_TRUST_PROXY: "true"  # only Caddy reaches the API; its X-Forwarded-For entry is the real client
      RASAD_MARKING: ${RASAD_MARKING:-OFFICIAL}
      RASAD_LICENCE_FILE: ${RASAD_LICENCE_FILE:-}
      RASAD_SMTP_HOST: ${RASAD_SMTP_HOST:-}
      RASAD_SMTP_PORT: ${RASAD_SMTP_PORT:-587}
      RASAD_SMTP_USER: ${RASAD_SMTP_USER:-}
      RASAD_SMTP_PASSWORD: ${RASAD_SMTP_PASSWORD:-}
      RASAD_SMTP_FROM: ${RASAD_SMTP_FROM:-rasad@localhost}
      RASAD_DIGEST_TO: ${RASAD_DIGEST_TO:-}
      RASAD_PUBLIC_URL: ${RASAD_PUBLIC_URL:-}
      RASAD_PIPELINE_TIME: ${RASAD_PIPELINE_TIME:-06:00}
      RASAD_POLL_INTERVAL_HOURS: ${RASAD_POLL_INTERVAL_HOURS:-4}
      TZ: ${TZ:-Asia/Dubai}
    volumes:
      - rasad_data:/data
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-:80}  # blank means plain HTTP on port 80 (Caddy needs an address, not an empty string)
    ports:
      # RASAD_BIND=127.0.0.1 (written by install.sh when there is no domain) keeps the web ports off
      # the network; Docker's published ports bypass host firewalls such as ufw
      - "${RASAD_BIND:-0.0.0.0}:80:80"
      - "${RASAD_BIND:-0.0.0.0}:443:443"
      - "${RASAD_BIND:-0.0.0.0}:443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  scheduler:
    build: .
    restart: unless-stopped
    environment:
      <<: *api_env
      RASAD_PIPELINE_TIME: ${RASAD_PIPELINE_TIME:-06:00}
      RASAD_POLL_INTERVAL_HOURS: ${RASAD_POLL_INTERVAL_HOURS:-4}
      RASAD_PIPELINE_RUN_ON_START: "false"
    volumes:
      - rasad_data:/data
    command: ["python", "-m", "rasad.pipelines.scheduler"]
    depends_on:
      db:
        condition: service_healthy

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${RASAD_DB_PASSWORD}
      RETENTION_DAYS: ${RASAD_BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - backups:/backups
    command: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

  # One-shot: seed reference data, ledgers and a 30-day forecast history.
  #   docker compose --profile seed run --rm seed
  seed:
    build: .
    profiles: ["seed"]
    environment: *api_env
    volumes:
      - rasad_data:/data
    command: ["python", "-m", "rasad.seed.load"]
    depends_on:
      db:
        condition: service_healthy

  # Manual pipeline run:  docker compose --profile pipeline run --rm pipeline
  pipeline:
    build: .
    profiles: ["pipeline"]
    environment: *api_env
    volumes:
      - rasad_data:/data
    command: ["python", "-m", "rasad.pipelines.run", "daily"]

  # First run on a connected host: PortWatch since 2024, the MSCIO library, sanctions, QNA, GDELT.
  #   docker compose --profile pipeline run --rm backfill
  backfill:
    build: .
    profiles: ["pipeline"]
    environment: *api_env
    volumes:
      - rasad_data:/data
    command: ["python", "-m", "rasad.pipelines.run", "backfill"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  rasad_data:
  caddy_data:
  caddy_config:
  backups:
