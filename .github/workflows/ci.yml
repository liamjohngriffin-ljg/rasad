name: ci
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: rasad
          POSTGRES_USER: rasad
          POSTGRES_DB: rasadtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rasad" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "backend[dev]"
      - name: tests (SQLite)
        run: cd backend && pytest -q
      - name: tests (PostgreSQL)
        env:
          RASAD_TEST_DATABASE_URL: postgresql+psycopg://rasad:rasad@localhost:5432/rasadtest
        run: cd backend && pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd frontend && npm ci && npm run build
  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rasad:ci .
