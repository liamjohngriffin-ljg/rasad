[project]
name = "rasad"
version = "0.2.0"
description = "Rasad: sovereign indicators-and-warnings engine for Gulf national security (working name)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "python-dateutil>=2.9",
    "feedparser>=6.0",
    "pdfplumber>=0.11",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
